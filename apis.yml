x-domain-note: >-
  4cinsights.com is still registered (AWS Route 53 nameservers) but has no HTTPS listener —
  TLS connect to 443 times out on both the apex and www. Port 80 answers and blanket-301s
  every path, including /openapi.json, /apis.json and every /.well-known/ path, to
  http://flashtalking.com/social, which lands on
  https://www.innovid.com/platform/social-ads-management. The redirect target belongs to
  Innovid/Mediaocean, so no artifact behind it is credited to 4C.
x-api-posture: no-product-api
x-api-posture-basis: observed
x-api-posture-note: >-
  No developer portal, documentation, machine-readable contract, hosted MCP server, agent card,
  first-party SDK or registry package was found for 4C on any host the record knows. npm search
  for "4cinsights" returns 0 packages, PyPI 404s, and github.com/4cinsights is a 404 — the only
  GitHub matches are two unaffiliated third-party test-framework repos.
