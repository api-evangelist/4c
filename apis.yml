aid: 4c
name: 4C
description: >-
  4C — legally 4C Insights, Inc. — was a Chicago-based marketing intelligence and advertising
  technology company founded in 2011 by Northwestern University professor Alok Choudhary,
  building on his research into large-scale data mining and social signal. Its Scope "closed
  ecosystems platform" let brands, agencies and media companies discover cross-channel audience
  insights, plan and execute paid campaigns inside walled-garden environments — Facebook,
  Instagram, X/Twitter, Snapchat, LinkedIn, Pinterest and connected TV — and measure the results
  in one self-service tool, with data delivery out to third-party systems by API, email, SFTP or
  web query. The company raised roughly $26 million through a Series C, grew to about 160 people
  and ran offices in Chicago, New York, Seattle and Singapore. Mediaocean announced its
  acquisition of 4C in July 2020 (reported at approximately $150 million) and folded the product
  into Flashtalking by Mediaocean; after Mediaocean's later combination with Innovid, the 4C
  social-advertising surface now lives inside Innovid's social ads management product. 4C never
  operated a public developer program: it consumed the advertising APIs of the closed ecosystems
  it served rather than publishing one of its own, and today the 4cinsights.com domain serves no
  HTTPS listener and blanket-301s every path to the acquirer's site. This profile is retained as
  a historical record; there is no 4C API surface to enrich.
